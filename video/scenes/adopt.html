<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adopt the Fragment</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The output below is the live run of tools/adopt-fragment.py, streamed by server.py. */
  :root { --bg:#140527; --bg-2:#0C0C36; --bg-3:#03031C; --card:#1C1340; --line:#3B2853; --fg:#FEF9FF; --body:#D8D1E0; --muted:#A79FBF;
          --purple:#8438FA; --purple-2:#C380FF; --teal:#23E2C2; --amber:#FFC56B; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg-3); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(900px 520px at 85% -10%, rgba(132,56,250,.38), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
  main { position: relative; padding: 22px 48px; opacity: 0; transition: opacity .45s; }
  main.ready { opacity: 1; }
  .stamp { font: 500 15px "Roboto Mono", monospace; letter-spacing: 1.5px; color: var(--teal); text-transform: uppercase; }
  h1 { font: 700 32px Lexend, sans-serif; margin: 4px 0 12px; }
  h1 span { color: var(--purple-2); }
  .term { background: #0d0a1f; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 48px rgba(3,3,28,.5); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #1a1433; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3b2f5c; display: inline-block; }
  .bar b { margin-left: 10px; font-weight: 500; }
  pre { margin: 0; padding: 12px 18px; height: 548px; font: 12.5px/1.42 "Roboto Mono", monospace; color: var(--body); white-space: pre; overflow: hidden; }
  .cmd { color: var(--fg); } .cmd::before { content: "$ "; color: var(--teal); }
  .ok { color: var(--teal); } .drift { color: var(--amber); background: rgba(255,197,107,.09); }
  .sum { color: var(--fg); font-weight: 500; }
  .caret { display: inline-block; width: 8px; height: 15px; background: var(--teal); vertical-align: -2px; animation: b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity: 0; } }
</style>
</head>
<body>
<main id="main">
  <div class="stamp">Meridian Bank · Friday 16:24</div>
  <h1>Swap every copy for a <span>reference</span></h1>
  <div class="term">
    <div class="bar"><i></i><i></i><i></i><b>platform-team — Tyk Dashboard API</b></div>
    <pre id="out"></pre>
  </div>
</main>
<script>
  const out = document.getElementById('out');
  const add = (text, cls) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; out.appendChild(s); return s; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  document.fonts.ready.then(async () => {
    document.getElementById('main').classList.add('ready');
    await sleep(700);
    const cmd = 'tools/adopt-fragment.py --fragment cors-browser-apps --path x-tyk-api-gateway.middleware.global.cors';
    const line = add('', 'cmd'), caret = add('', 'caret');
    for (const ch of cmd) { line.textContent += ch; await sleep(16); }
    await sleep(500); caret.remove(); add('\n');
    const res = await fetch('/adopt', { method: 'POST' });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    const flush = async (l) => {
      add(l + '\n', l.includes('DRIFTED') ? 'drift' : /APIs? now reference/.test(l) ? 'sum' : l.includes('✔') ? 'ok' : '');
      out.scrollTop = out.scrollHeight;
      await sleep(l.includes('DRIFTED') ? 380 : 90);    // pace the output so a viewer can read it
    };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) { await flush(buf.slice(0, i)); buf = buf.slice(i + 1); }
    }
    if (buf) await flush(buf);
  });
</script>
</body>
</html>
